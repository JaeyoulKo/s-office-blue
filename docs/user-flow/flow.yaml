version: 1

# 스토리보드(FigJam 캡처 PNG 6장)를 LLM이 읽을 수 있게 옮긴 것.
# 원본은 docs/storyboard/ 에 그대로 있고 수정하지 않는다. 여기가 틀리면 원본이 이긴다.
#
# 규칙:
#   - 노드마다 어느 이미지 어느 영역에서 왔는지 source 로 되짚을 수 있어야 한다.
#   - 그림에서 읽어낸 것과 해석한 것을 certainty 로 구분한다. 추론으로 안전 경계를 넓히지 않는다.
#   - 판정 기준(회색 스티커)은 여기 두지 않고 criteria.yaml 에 규칙 데이터로 둔다.

source:
  origin: 'FigJam "User Flow Diagram Template (Community)"'
  assets_dir: ../storyboard
  assets: [overview.png, 01_left.png, 02_right.png, 03_left_below.png, 04_right_below.png, 05_bottom.png]
  conflict_rule: PNG가 최종 근거다. 문서와 어긋나면 PNG를 인용하고 certainty를 낮춘다.

# 스토리보드는 색으로 의미를 나눈다. 그림 없이 이 파일만 읽어도 복원되도록 먼저 선언한다.
legend:
  screen:      진한 보라 — 사용자가 보는 화면
  state:       연한 보라 — 분류 결과 또는 데이터 상태
  action:      초록 — 시스템 또는 사용자의 행위
  decision:    주황 마름모 — 분기
  terminal:    분홍 — 종료
  annotation:  회색 스티커 — 판정 기준·메모 (criteria.yaml 로 옮김)
  unresolved:  주황 별 — 아직 정해지지 않음 (README.md 의 미해결 목록)

certainty_levels:
  confirmed:   그림에 그대로 있다
  interpreted: 그림에서 읽어냈지만 표현이 모호해 해석이 들어갔다
  undecided:   보드에서도 정해지지 않았다. 구현 전에 사람이 정해야 한다

# 지금 구현 범위: 분류(4갈래) + 우선순위 + 브리핑.
# 나머지는 스펙으로만 남기고 코드로 만들지 않는다.
scope:
  in_scope: [SCREEN-HOME, ACT-BRIEF-CLICK, DEC-CLASSIFY, CAT-IMPORTANT, CAT-ARIBA,
             CAT-DISCUSSION, CAT-NOTICE, ACT-IMPORTANT-DELIVER, DEC-ANALYSIS-DONE,
             ACT-BRIEF-GENERATE, ACT-COUNT-PRIORITIZE, SCREEN-BRIEFING,
             END-IMPORTANT, END-NOTICE, END-BRIEFING]
  spec_only: 나머지 전부 — 다음 스프린트 대상

nodes:

# ─────────────────────────────────────────────── 진입
- id: SCREEN-HOME
  label_ko: 시작 화면
  type: screen
  source: {asset: 01_left.png, region: 좌측 상단 시작점}
  certainty: confirmed
  edges: [{to: ACT-BRIEF-CLICK}]

- id: ACT-BRIEF-CLICK
  label_ko: 메일 브리핑 버튼 클릭
  type: action
  source: {asset: 01_left.png, region: 좌측 '클릭시' 스티커}
  certainty: confirmed
  params:
    date_range: 사용자가 설정한 날짜 기간
    unread_only: true
    max_messages: 50
  edges: [{to: DEC-CLASSIFY}]
  implements: harness/gmail.py collect()

- id: DEC-CLASSIFY
  label_ko: AI 분석 — 메일 유형 분류
  type: decision
  source: {asset: 01_left.png, region: 좌측 중앙 마름모 + '분류 기준' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#classification
  skill: mail-classify
  note: 보드 스티커에 '분류 skills (작성 예정)'이라고 적혀 있다. 그 미작성 항목이 이 스킬이다.
  edges:
  - {to: CAT-IMPORTANT, when: 중요 키워드 또는 지정 발신인}
  - {to: CAT-ARIBA,      when: 승인 요청 또는 Ariba 키워드}
  - {to: CAT-DISCUSSION, when: 문의·논의·견적 등 구매 적정성 논의}
  - {to: CAT-NOTICE,     when: 요구 행위가 없는 공지·안내}

# ─────────────────────────────────────────────── 갈래 1 · 중요
- id: CAT-IMPORTANT
  label_ko: 사용자 확인 중요 이메일
  type: state
  source: {asset: 01_left.png, region: 상단 '해당 키워드/해당 발신인' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#important_email
  edges: [{to: ACT-IMPORTANT-DELIVER}]

- id: ACT-IMPORTANT-DELIVER
  label_ko: 카운트 및 메일 제목과 링크 전달
  type: action
  source: {asset: 01_left.png, region: 상단 중앙}
  certainty: confirmed
  edges: [{to: END-IMPORTANT}]

- id: END-IMPORTANT
  label_ko: Done
  type: terminal
  source: {asset: 01_left.png, region: 상단 우측}
  certainty: confirmed
  edges: []

# ─────────────────────────────────────────────── 갈래 2 · Ariba 승인
- id: CAT-ARIBA
  label_ko: 구매 승인 요청 이메일 (Ariba)
  type: state
  source: {asset: 01_left.png, region: 중앙 + '구매승인 이메일 분류 기준' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#purchase_approval
  edges: [{to: DEC-EXPENSE-ITEMS}]

- id: DEC-EXPENSE-ITEMS
  label_ko: 지출결의서 구성항목 확인 (아이템, 금액, 산정근거 등)
  type: decision
  source: {asset: 01_left.png, region: 중앙 우측 첫 번째 마름모}
  certainty: confirmed
  edges:
  - {to: DEC-QUANT-EFFECT,  when: 'Yes — 구성항목이 갖춰짐'}
  - {to: ACT-DRAFT-ITEMS,   when: 'No — 필수 구성항목 미비'}

- id: ACT-DRAFT-ITEMS
  label_ko: 미비한 필수 구성항목에 대한 보완 요청 이메일 작성
  type: action
  source: {asset: 02_right.png, region: 좌측 상단}
  certainty: confirmed
  edges: [{to: ACT-USER-APPROVE}]

- id: DEC-QUANT-EFFECT
  label_ko: 정량적 기대 효과 확인 (매출 증가, 비용 감소, 고객…)
  type: decision
  source: {asset: 01_left.png, region: 중앙 우측 두 번째 마름모 + 판정 스티커}
  certainty: confirmed
  criteria: criteria.yaml#expected_effect_insufficient
  edges:
  - {to: DEC-PRIOR-CONTRACT, when: 'Yes — 정량적 기대효과 확인됨'}
  - {to: ACT-DRAFT-EFFECT,   when: 'No — 기대효과 미비'}

- id: ACT-DRAFT-EFFECT
  label_ko: 정량적 기대 효과에 대한 보완 요청 이메일 초안 작성
  type: action
  source: {asset: 02_right.png, region: 좌측 중앙}
  certainty: confirmed
  edges: [{to: ACT-USER-APPROVE}]

- id: DEC-PRIOR-CONTRACT
  label_ko: 이전 유사 계약과 비교 검토 (단가, 범위, 기간 등)
  type: decision
  unresolved: true          # 보드에 주황 별
  source: {asset: 01_left.png, region: 하단 주황 별이 붙은 마름모}
  certainty: undecided
  open_question: 비교 대상 계약 DB가 무엇인지 보드에 정해져 있지 않다.
  edges: [{to: ACT-CONTRACT-DB-SEARCH}]

- id: ACT-CONTRACT-DB-SEARCH
  label_ko: 과거 계약서를 정리해놓은 DB 서치 후 이전 계약과 비교 분석
  type: action
  source: {asset: 03_left_below.png, region: 상단 중앙 + '이전 계약 판단 기준' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#prior_contract_match
  edges: [{to: ACT-ARIBA-BRIEF}]

- id: ACT-USER-APPROVE
  label_ko: 사용자 승인
  type: action
  actor: user
  source: {asset: 02_right.png, region: 우측 상단·중앙 두 곳}
  certainty: confirmed
  edges: [{to: END-MAIL-SENT, when: 승인}, {to: ACT-ARIBA-BRIEF, when: 검토 결과로 합류}]

- id: END-MAIL-SENT
  label_ko: 메일 발송
  type: terminal
  source: {asset: 02_right.png, region: 우측 상단·중앙 분홍 박스}
  certainty: undecided
  open_question: >-
    보드는 승인 후 발송으로 끝나지만 현행 안전 경계는 초안까지다 (AGENTS.md).
    발송 권한을 줄지, 준다면 어떤 조건인지 정해지지 않았다. 이 프로젝트에서 가장 중요한 미결 사항.
  edges: []

- id: ACT-ARIBA-BRIEF
  label_ko: 구매 승인 요청 메일 검토 결과 브리핑 포맷 요약
  type: action
  source: {asset: 04_right_below.png, region: 좌측 중앙 + '검토 결과 금액순 요약' 스티커}
  certainty: confirmed
  output_shape: '필수 구성항목 보완 필요 xx건 / 기대효과 보완 필요 yy건 / 승인 가능 zz건 — 금액순, 링크 포함'
  edges: [{to: DEC-ARIBA-AGGREGATE}]

- id: DEC-ARIBA-AGGREGATE
  label_ko: Ariba 결과 취합
  type: decision
  source: {asset: 04_right_below.png, region: 중앙 마름모}
  certainty: confirmed
  edges: [{to: STATE-ARIBA-LIST}, {to: DEC-ANALYSIS-DONE, when: 전체 브리핑으로 합류}]

- id: STATE-ARIBA-LIST
  label_ko: 탭에 리스트화면
  type: state
  source: {asset: 04_right_below.png, region: 우측 + 초록 스티커}
  certainty: confirmed
  note: '기본값 읽지 않음. 리스트에서 읽음/읽지않음 버튼 선택 가능. (작성자 HJK)'
  edges: [{to: ACT-HISTORY-BTN}]

- id: ACT-HISTORY-BTN
  label_ko: 과거 데이터와 분석 버튼 클릭
  type: action
  actor: user
  source: {asset: 04_right_below.png, region: 우측}
  certainty: confirmed
  edges: [{to: SCREEN-HISTORY-COMPARE}]

- id: SCREEN-HISTORY-COMPARE
  label_ko: 과거 데이터 비교 분석 화면
  type: screen
  source: {asset: 04_right_below.png, region: 우측 끝}
  certainty: confirmed
  edges: []

# ─────────────────────────────────────────────── 갈래 3 · 논의
- id: CAT-DISCUSSION
  label_ko: 논의 이메일
  type: state
  source: {asset: 03_left_below.png, region: 좌측 하단 + 정의 스티커}
  certainty: confirmed
  definition: >-
    구매승인 메일(ariba) 및 공지/안내 메일 외의 메일 중 '문의' / '논의' / '견적' 등의
    키워드를 포함하는 = 즉, 지출결의 전 구매 적정성에 대해 논의하는 부분
  edges: [{to: DEC-ARCHIVE-NEEDED}, {to: DEC-HISTORY-COMPARE}]

- id: DEC-ARCHIVE-NEEDED
  label_ko: 아카이빙이 필요한가?
  type: decision
  source: {asset: 03_left_below.png, region: 하단 좌측 마름모}
  certainty: confirmed
  edges: [{to: DEC-HAS-ATTACHMENT, when: Yes}]

- id: DEC-HAS-ATTACHMENT
  label_ko: 첨부파일 존재?
  type: decision
  source: {asset: 03_left_below.png, region: 하단 중앙 마름모}
  certainty: confirmed
  edges: [{to: ACT-BODY-ONLY, when: No}, {to: ACT-WITH-ATTACHMENT, when: Yes}]

- id: ACT-BODY-ONLY
  label_ko: 메일 본문만 분석
  type: action
  source: {asset: 03_left_below.png, region: 하단}
  certainty: confirmed
  edges: [{to: ACT-THREAD-SUMMARY}]

- id: ACT-WITH-ATTACHMENT
  label_ko: '+첨부파일 분석'
  type: action
  source: {asset: 03_left_below.png, region: 하단}
  certainty: confirmed
  edges: [{to: ACT-THREAD-SUMMARY}]

- id: ACT-THREAD-SUMMARY
  label_ko: LLM 기반 thread 요약
  type: action
  source: {asset: 03_left_below.png, region: 하단 우측}
  certainty: confirmed
  edges: [{to: DEC-PRIOR-RECORD}]

- id: DEC-PRIOR-RECORD
  label_ko: 과거 저장내역 유무
  type: decision
  source: {asset: 04_right_below.png, region: 하단 중앙 + '<기준>' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#thread_dedup
  edges:
  - {to: STATE-RECORD-EXISTING, when: 있음}
  - {to: STATE-RECORD-NEW,      when: 없음}

- id: STATE-RECORD-EXISTING
  label_ko: 기존 레코드 분석 (변경 기록 후 추가 등록)
  type: state
  source: {asset: 04_right_below.png, region: 하단 우측}
  certainty: confirmed
  edges: [{to: ACT-EXCEL-SAVE}]

- id: STATE-RECORD-NEW
  label_ko: 신규 레코드 생성
  type: state
  source: {asset: 04_right_below.png, region: 하단 우측}
  certainty: confirmed
  edges: [{to: ACT-EXCEL-SAVE}]

- id: ACT-EXCEL-SAVE
  label_ko: Excel 저장
  type: action
  source: {asset: 04_right_below.png, region: 하단 우측 + '<주요 요약사항>' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#excel_record
  edges: [{to: END-SAVED}]

- id: END-SAVED
  label_ko: 저장 완료 메시지
  type: terminal
  source: {asset: 04_right_below.png, region: 하단 우측 끝}
  certainty: confirmed
  edges: []

- id: DEC-HISTORY-COMPARE
  label_ko: 과거 내역 비교?
  type: decision
  unresolved: true          # 보드에 주황 별
  source: {asset: 05_bottom.png, region: 상단 좌측 주황 별이 붙은 마름모}
  certainty: undecided
  open_question: >-
    유사 요청 간 가격 비교(협상력) — 다른 사업부/다른 시점에 비슷한 설비를 산 이력과 비교해
    이 가격이 합리적인지 판단 근거를 자동으로 붙여주는 것. 구현 범위 미정. (작성자 서정)
  edges: [{to: STATE-RESULT}]

- id: STATE-RESULT
  label_ko: 결과 화면
  type: state
  source: {asset: 05_bottom.png, region: 상단 좌측}
  certainty: interpreted
  edges: []

# ─────────────────────────────────────────────── 갈래 4 · 공지
- id: CAT-NOTICE
  label_ko: 공지/안내 메일
  type: state
  source: {asset: 05_bottom.png, region: 좌측 중앙}
  certainty: confirmed
  edges: [{to: END-NOTICE}]

- id: END-NOTICE
  label_ko: Done
  type: terminal
  source: {asset: 05_bottom.png, region: 좌측 중앙}
  certainty: confirmed
  edges: []

# ─────────────────────────────────────────────── 종단 집계
- id: DEC-ANALYSIS-DONE
  label_ko: 메일 분석 완료
  type: decision
  source: {asset: 05_bottom.png, region: 하단 좌측 마름모}
  certainty: confirmed
  note: 모든 갈래의 분석이 끝나면 여기로 합류한다.
  edges: [{to: ACT-BRIEF-GENERATE}]

- id: ACT-BRIEF-GENERATE
  label_ko: 메일 브리핑 생성
  type: action
  source: {asset: 05_bottom.png, region: 하단}
  certainty: confirmed
  skill: mail-brief
  edges: [{to: ACT-COUNT-PRIORITIZE}]

- id: ACT-COUNT-PRIORITIZE
  label_ko: 메일 종류별 갯수 카운트, 우선 순위 판별 및 요약 작성
  type: action
  source: {asset: 05_bottom.png, region: 하단 + '우선순위 판별' 스티커}
  certainty: confirmed
  criteria: criteria.yaml#briefing_priority
  skill: mail-prioritize
  edges: [{to: SCREEN-BRIEFING}]

- id: SCREEN-BRIEFING
  label_ko: 브리핑 화면
  type: screen
  source: {asset: 05_bottom.png, region: 하단 우측 + '브리핑 템플릿 링크' 스티커}
  certainty: confirmed
  note: 보드에 브리핑 템플릿 링크 스티커가 붙어 있으나 링크 대상이 캡처에 보이지 않는다.
  edges: [{to: END-BRIEFING}]

- id: END-BRIEFING
  label_ko: Done
  type: terminal
  source: {asset: 05_bottom.png, region: 하단 우측 끝}
  certainty: confirmed
  edges: []
