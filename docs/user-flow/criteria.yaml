version: 1

# 스토리보드의 회색 스티커(판정 기준)를 규칙 데이터로 옮긴 것.
# 스킬 문서와 테스트가 여기를 참조한다. 기준을 바꾸려면 여기를 먼저 고치고
# 근거(스토리보드 어느 부분인지)를 남긴다. 스킬 문서에서 기준을 새로 만들지 않는다.
#
# status: fixed  — 보드에서 확정됨
#         open   — 보드에 '더 추가해 주세요' 등 미완결 표시가 있음

classification:
  status: fixed
  source: {asset: 01_left.png, region: 좌측 '분류 기준' 스티커}
  raw: '분류 skills (작성 예정) / 중요도 판단, 첨부파일 분석, 필수항목 추출, 담당자 추출'
  # 위에서부터 확인하고 먼저 맞는 것에서 멈춘다. 순서가 곧 우선권이다.
  order: [purchase_approval, important_email, discussion, notice]
  fallback: unknown
  note: 넷 중 어디에도 확신이 없으면 억지로 고르지 않고 unknown 으로 둔다.

important_email:
  status: open          # 보드에 '키워드 더 추가해 주세요' 메모가 붙어 있다
  source: {asset: 01_left.png, region: 상단 '해당 키워드 / 해당 발신인' 스티커}
  match: any            # 키워드 또는 발신인 중 하나만 걸려도 해당
  keywords:
  - 긴급
  - 중요
  - ASAP
  - Immediate
  - Urgent
  - 최고 우선
  - 필독
  - 즉시
  - 금일
  - 오늘까지
  - 마감
  - Due Today
  - Due Tomorrow
  - 계약
  - 법무
  - 소송
  - 내용증명
  senders: [CFO, Finance Boss 1]
  guard: 키워드가 있어도 수신자에게 요구하는 행위가 없으면 notice 다. (예 '[필독] 사내 체육대회 안내')

purchase_approval:
  status: fixed
  source: {asset: 01_left.png, region: 중앙 '구매승인 이메일 분류 기준' 스티커}
  match: any
  keywords: [Action Required, 승인 요청, 결재 요청, Ariba]
  reference: https://app.notion.com/p/3ac0deb3c08080e69463e742de67d07d?showMoveTo=true
  guard: >-
    Ariba 시스템이 보낸 단순 상태 알림('귀하의 요청이 승인되었습니다')은 승인을 요구하지
    않으므로 notice 다.

discussion:
  status: fixed
  source: {asset: 03_left_below.png, region: 좌측 하단 정의 스티커}
  match: any
  keywords: [문의, 논의, 견적]
  definition: >-
    구매승인 메일(ariba) 및 공지/안내 메일 외의 메일 중 위 키워드를 포함하는,
    즉 지출결의 전 구매 적정성에 대해 논의하는 단계.

notice:
  status: fixed
  definition: 수신자에게 요구하는 행위가 없는 메일. 사내 공지, 뉴스레터, 시스템 자동 알림.

# ─────────────────────────────────────────── Ariba 승인 검토 (이번 범위 밖, 스펙만)

expense_report_items:
  status: fixed
  source: {asset: 01_left.png, region: '지출결의서 구성항목 확인' 마름모}
  required_fields: [아이템, 금액, 산정근거]
  on_missing: 미비한 필수 구성항목에 대한 보완 요청 이메일 작성

expected_effect_insufficient:
  status: fixed
  source: {asset: 01_left.png, region: '아래의 경우 기대 효과 항목 미비로 판단' 스티커}
  match: any            # 보드에 (or) 로 명시
  rules:
  - 정성적 표현만 있는 경우
  - 정량적 표현(eg. 매출 성장, 비용 감소, 고객 유입 등)이 있으나 계산 근거가 없는 경우
  - 투자성 지출의 경우 투자액 대비 수익률이 ~50% 미만인 경우
  note: 세 번째 항목의 '~50%'는 보드 표기 그대로다. 부등호 방향이 모호해 사람 확인이 필요하다.

prior_contract_match:
  status: fixed
  source: {asset: 03_left_below.png, region: '이전 계약 판단 기준 (and)' 스티커}
  match: all            # 보드에 (and) 로 명시
  rules:
  - 동일한 벤더
  - 동일한 아이템
  - 최근 3년 이내 체결

# ─────────────────────────────────────────── 논의 이메일 아카이빙 (이번 범위 밖, 스펙만)

thread_dedup:
  status: fixed
  source: {asset: 04_right_below.png, region: '<기준>' 스티커}
  author: 서정
  primary: [같은 스레드인가 (Re 포함 여부), 스레드 헤더 Message-ID]
  secondary: 애매한 경우 LLM 판단 (스레드 헤더가 없거나 새 제목으로 온 경우)

excel_record:
  status: fixed
  source: {asset: 04_right_below.png, region: '<주요 요약사항>' 스티커}
  author: 서정
  fields: [담당자, 담당부서, 날짜, 주요결정사항, 금액(조건변경)]

# ─────────────────────────────────────────── 브리핑 (이번 범위)

briefing_priority:
  status: fixed
  source: {asset: 05_bottom.png, region: '구매승인 요청 이메일 우선순위 판별' 스티커}
  raw: [금액순 top5, 세금·tax 키워드 포함, 지급기일 초과 키워드 포함]
  # 보드는 세 항목을 나열만 했다. 순위를 매기려면 순서가 필요해서 티어로 해석했다.
  # skills/mail-prioritize/references/rules.md 와 같은 내용이어야 한다.
  interpreted_tiers:
  - {tier: T1, when: 지급기일 초과·연체·overdue·past due, certainty: interpreted}
  - {tier: T2, when: 세금·tax·세금계산서·부가세,          certainty: confirmed}
  - {tier: T3, when: important 로 분류됨,                 certainty: interpreted}
  - {tier: T4, when: ariba_approval 중 금액 상위 5건,      certainty: confirmed}
  - {tier: T5, when: 명시된 기한이 오늘·내일,              certainty: interpreted}
  - {tier: T6, when: 나머지 ariba_approval·discussion,     certainty: interpreted}
  - {tier: null, when: notice·unknown,                     certainty: interpreted}
  tie_break: [금액 큰 순, 기한 이른 순]
  note: >-
    티어 순서는 보드에 없다. 나열된 세 항목만 confirmed 이고 나머지는 해석이다.
    사람이 확정하면 certainty 를 confirmed 로 올린다.

read_state:
  status: fixed
  source: {asset: 04_right_below.png, region: 우측 초록 스티커}
  author: HJK
  default: 읽지 않음
  behavior: 리스트에서 읽음/읽지않음 버튼 선택 가능
