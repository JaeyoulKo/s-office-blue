[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-blue-email-archive"
version = "0.1.0"
description = "Email thread analysis and Excel-backed archive repository"
requires-python = ">=3.10"
dependencies = [
  "openai>=1.0",
  "openpyxl>=3.1",
  "pydantic>=2.0",
  "streamlit>=1.40",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["archive*"]
