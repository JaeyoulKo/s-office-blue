[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-blue"
version = "0.1.0"
description = "Ariba purchase email completeness review and clarification draft generator"
requires-python = ">=3.10"

[project.scripts]
office-blue = "office_blue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

