[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "office-blue"
version = "0.1.0"
description = "Office Blue email review and archive application"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.0",
    "openpyxl>=3.1",
    "pydantic>=2.0",
    "streamlit>=1.40",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
office-blue = "office_blue.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

