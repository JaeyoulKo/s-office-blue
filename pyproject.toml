[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'office-blue'
version = '0.1.0'
description = 'Folder-first Codex Skill, Streamlit, and ablation template'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
# st.badge와 :color-badge[] 마크다운은 1.45, st.segmented_control은 1.40에 들어왔다.
ui = [
  'streamlit>=1.45,<2',
  'openpyxl>=3.1,<4',
  'google-api-python-client>=2.199,<3',
  'google-auth-oauthlib>=1.4,<2',
  'google-auth-httplib2>=0.4,<1',
]

[tool.setuptools.packages.find]
include = ['main_service*']

[tool.setuptools.package-data]
main_service = ['*.json']
