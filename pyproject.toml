[build-system]
requires = ['setuptools>=68']
build-backend = 'setuptools.build_meta'

[project]
name = 'office-blue'
version = '0.1.0'
description = 'Folder-first Codex Skill, Streamlit, and ablation template'
readme = 'README.md'
requires-python = '>=3.10'
dependencies = []

[project.optional-dependencies]
ui = ['streamlit>=1.37,<2']

[tool.setuptools.packages.find]
include = ['main_service*']

[tool.setuptools.package-data]
main_service = ['*.json']
